[project]
name = "kargin"
version = "0.0.1"
description = "Kargin sketch search and discovery."
requires-python = ">=3.11"   # numpy 2.4 and pandas 3.0 both dropped 3.10; the venv was already 3.11
dependencies = [
    "yt-dlp==2026.10.26",
    "pandas==3.0.2",
    "numpy==2.4.4", # audio fingerprinting; np.bitwise_count needs numpy >= 2.0
    "requests==2.33.1",
    "python-dotenv==1.2.2",
    "google-genai==2.18.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]   # the build pipeline tests; ignore the frozen old/ Streamlit app
# Default norecursedirs includes "build", which would skip tests/build/. Override it
# (keep ignoring old/ and the usual noise) so the pipeline tests are actually collected.
norecursedirs = ["old", ".*", "node_modules", ".venv", "dist", "*.egg"]

[dependency-groups]
dev = [
    "pytest==9.1.0",
]
firebase = [
    # Admin-side mirror sync into Firestore. Run with:
    # uv run --group firebase python scripts/sync_firestore.py
    "google-cloud-firestore==2.30.0",
]
match = [
    # Landmark audio fingerprinting: finds a clip anywhere inside the archive, with its
    # time offset (DECISIONS #21). Kept out of the core deps: only the matching tools
    # need it. Run with: uv run --group match python scripts/audio_index.py ...
    "audfprint2==0.1.2",
]
review = [
    # Optional: local-only curation UI. Never deployed; run with
    # uv run --group review python scripts/review_ui.py
    "flask==3.1.3",
]
songs = [
    # Optional: unofficial reverse-engineered Shazam client, no API key. Kept out
    # of the core deps because it breaks whenever Shazam changes its private service.
    # Run with: uv run --group songs python scripts/recognize_songs.py
    "shazamio==0.8.1",
]
