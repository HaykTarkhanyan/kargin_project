name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # `uv sync` alone installs the default group only, which does NOT include
      # flask -- so tests/review/* failed to import and every deploy since the
      # review UI landed (2026-08-02) died at collection. Sync the groups the
      # test suite actually imports.
      - run: uv sync --group review --group firebase
      - name: Python tests
        run: PYTHONPATH=. uv run pytest -q
      - name: Build site data (CSV -> sketches.json)
        run: PYTHONPATH=scripts uv run python scripts/build_site_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Lint
        run: npm run lint
        working-directory: web
      - name: Type check
        run: npx tsc --noEmit
        working-directory: web
      - name: Unit tests
        run: npm test
        working-directory: web
      # The bot imports web/lib directly — run its tests so a web/lib change
      # can't silently break the other surface.
      - run: npm ci
        working-directory: bot
      - name: Bot tests + typecheck
        run: npm test && npm run typecheck
        working-directory: bot
      # firebase-tools 15 needs Java 21+ to run the Firestore emulator.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Firestore rules tests (emulator)
        run: npm run test:rules
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # Usage logging writes straight to Firestore (see web/lib/log.ts); a
          # no-op until the FIREBASE_PROJECT_ID repo variable is set.
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      # Parallel host during the Firebase migration (see docs/superpowers/specs/
      # 2026-09-06-firebase-migration-design.md). Skipped until the FIREBASE_PROJECT_ID
      # repo variable is set; GitHub Pages keeps deploying until phase 4 cutover.
      - name: Deploy to Firebase Hosting
        if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
        working-directory: web
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx firebase deploy --only firestore,hosting --project "${{ vars.FIREBASE_PROJECT_ID }}" --force
      # After (not before) a successful deploy: the Firestore mirror must never
      # hold data the deployed site doesn't reflect yet.
      - name: Sync sketches to Firestore
        if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: uv run --group firebase python scripts/sync_firestore.py --project "${{ vars.FIREBASE_PROJECT_ID }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
