name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # `uv sync` alone installs the default group only, which does NOT include
      # flask -- so tests/review/* failed to import and every deploy since the
      # review UI landed (2026-08-02) died at collection. Sync the groups the
      # test suite actually imports.
      - run: uv sync --group review
      - name: Python tests
        run: PYTHONPATH=. uv run pytest -q
      - name: Build site data (CSV -> sketches.json)
        run: PYTHONPATH=scripts uv run python scripts/build_site_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Lint
        run: npm run lint
        working-directory: web
      - name: Type check
        run: npx tsc --noEmit
        working-directory: web
      - name: Unit tests
        run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # Set repo variable LOG_ENDPOINT (Settings → Variables) to your Worker URL to enable usage logging.
          NEXT_PUBLIC_LOG_ENDPOINT: ${{ vars.LOG_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      # Parallel host during the Firebase migration (see docs/superpowers/specs/
      # 2026-09-06-firebase-migration-design.md). Skipped until the FIREBASE_PROJECT_ID
      # repo variable is set; GitHub Pages keeps deploying until phase 4 cutover.
      - name: Deploy to Firebase Hosting
        if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
        working-directory: web
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx firebase deploy --only hosting --project "${{ vars.FIREBASE_PROJECT_ID }}" --force

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
