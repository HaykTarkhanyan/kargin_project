notes = """
Data shape used for authoring: kargin_eng.csv text_common (catchphrases) and
text (dialogue), roles_names for character names, youtube_metadata view_count
for popularity, visual_annotations best_frame_ts as a starting point for stills
(often a wide or odd frame; hand-picked timestamps won 5 times out of 12).

Correct answers are never in the Google Forms dumps (grading withheld until
submission), so the forms were a style reference only; every fact here comes
from the CSV.

vitest gotcha: under the jsdom environment import.meta.url is not a file: URL,
so fileURLToPath() throws; __dirname (injected by vite-node) works.

Local static preview: python -m http.server on web/out. Next's link prefetch
requests __next.sketch.$d$id.txt under each /sketch/<id>/ and gets 404 there;
the same happens for the existing sketch links and does not happen on the real
host, so it is a local-server artefact, not a quiz bug.
