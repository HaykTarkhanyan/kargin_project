notes = """
Three of my own bugs cost real time and are worth remembering.

1. str(e).splitlines()[0] raises IndexError when an exception carries no message.
   asyncio.TimeoutError is exactly that, so a routine timeout made the ERROR HANDLER
   crash and killed a 485-clip run. The same unguarded pattern was in all seven
   long-running scripts; all fixed. A crash inside the code that reports failures
   defeats the point of having it.

2. Counter(found).most_common(1)[0] IndexErrors on an empty counter. Same class of
   bug, also fatal to a long run.

3. I blamed the environment for killing runs before checking my own code. Some kills
   were external, but at least two were mine.

On method: the release-date filter was wrong twice before being removed entirely.
upload_date is an archive-dump timestamp (702 videos across 9 dates), the air dates
are earlier and less certain than public sources state, and Shazam reports the date of
the RELEASE it matched -- often a later compilation of an older recording. There was
never a trustworthy date to bound on. The replacement needs no external facts: match
stability. But the FIRST stability implementation was also wrong -- re-sending
identical bytes is deterministic and a known-spurious clip came back 2/2 "stable".
Varying the evidence (a time-shifted window) is what actually tests a match.

Browser verification caught a layout regression that 58 passing tests did not: variable
dialogue length made grid cards stretch to the tallest in the row, leaving up to 196px
of dead space. Fixing it took three parts, and the second only surfaced by measuring.
"""
