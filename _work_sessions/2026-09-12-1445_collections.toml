notes = """
Two Playwright problems worth remembering. A stale MCP browser held its Chrome
profile lock after /mcp reconnected, and every call failed with "Browser is
already in use"; killing only the chrome.exe processes whose command line
contains ms-playwright-mcp cleared it and left the owner's 26 Chrome processes
alone. Screenshots of the home page also time out at the MCP's fixed 5s limit,
so browser_run_code_unsafe with page.screenshot({timeout: 30000}) is the way to
get one.

A local static server must not have its working directory inside web/out, or
next build cannot delete the folder and fails with an rmdir error. Use
python -m http.server --directory web/out from the repo root.

Git Bash parsed a quoted heredoc body and choked on the apostrophes in my
regexes, so python files went in through the Write tool instead. Parallel Bash
calls also share one working directory, which made a relative path in one call
resolve against another call's cd.
"""
