notes = """
Playwright MCP gotchas met here:
- browser_evaluate with a filename writes the result to the current working
  directory (the repo root), not to .playwright-mcp/. Screenshots with a
  relative filename land there too.
- The saved evaluate result is JSON-encoded: a string return comes back as a
  quoted JSON string (HTML with \\" everywhere), an object return as a JSON
  string inside a JSON file. Both were json.loads-unwrapped once by hand before
  parsing; the parser expects plain files.

Google Forms image URLs (docs.google.com/forms-images-rt/<token>=w<width>)
serve a downscaled copy; dropping the =w suffix returns the original, and the
content type varies between png and jpeg regardless of what the page shows.
"""
