notes = """
Architecture worth remembering when picking up:
- The bot imports web/lib/{search,translit,normalize,format,types,site} by RELATIVE path; only fuse.js is a shared runtime dep. Data is fs-read from web/public/data/sketches.json (not bundled) — path resolves one level under bot/ so src/ and dist/ both work; Docker copies it to the same relative layout.
- Callback grammar (bot/src/cards.ts): every results-view button carries the full encoded state, so filters/paging/panels compose by construction. safeCallback() drops (never truncates) anything over Telegram's 64-BYTE cap — Armenian is 2 bytes/char, which is why facets are index-encoded.
- Facet indexes derive from data frequency at boot; a corpus rebuild can reorder them, making OLD messages' filter buttons apply a mislabeled filter (self-corrects on next tap). Known, accepted.
- Restart ritual after editing bot code: npm test && npm run typecheck && npm run build in bot/, then kill+relaunch the background node process. Telegram inline results cache per query for 300s — vary the query when eyeballing changes.
"""
