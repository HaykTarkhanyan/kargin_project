done = [
    "Feedback on the website: a collapsed one-liner that only becomes a form on a tap. Prominent in the empty-results state (with the failed query shown back), quiet under a full page of results, and on watch pages as 'report a mistake' — that page is largely machine-written, so visitors are the ones who notice errors.",
    "Feedback in the bot: a button on the no-results message plus /feedback. The prompt goes out with force_reply and is recognised by its own first character, so the reply carries the prompt — and the failed query — back. The bot scales to zero; anything held in memory between two updates would be gone.",
    "Storage: a new `feedback` collection, NOT `events`. Create-only, unreadable by any client, shape- and size-capped in firestore.rules (9 new rules tests, 18 passing). Reports are the one place a person types free text a human will read — a different risk shape from telemetry, and not worth loosening the telemetry contract for. DECISIONS.md #14.",
    "The send is awaited rather than fire-and-forget, unlike logging: someone is waiting to hear it landed. A failure is shown plainly with their text still in the box — verified by accident when a local build without NEXT_PUBLIC_FIREBASE_PROJECT_ID failed exactly that way.",
    "Read path added to scripts/non_essential/report_usage.py, since clients deliberately cannot read the collection back. Reports print in full — there will never be so many that reading them is a burden.",
    "Verified end to end on the LIVE site: submitted a report, read it back out of Firestore with the admin SDK (kind, source, failed query, message all correct), then deleted the test document. Collection left empty.",
    "Bot deployed to Cloud Run as :v3 WITHOUT building a container locally. Docker Desktop was not running and a cold local build is what froze the machine on 2026-09-07, so the build went to Cloud Build instead: 807 KB of source (only what the Dockerfile COPYs), ~3 minutes, nothing running on the laptop. Kept as scripts/deploy_bot.py.",
    "Verified after deploy: /health 200 ok, webhook registered with 0 pending and no last_error, /feedback now in getMyCommands (which proves the new image is live), and BOT_TOKEN / WEBHOOK_URL / FIREBASE_PROJECT_ID all survived the Cloud Run patch.",
    "Fixed two bot examples that never exercised the search type they advertised: 'Челентано' could not reach the Latin-stored song credits at all (the index only transliterates Armenian) and passed only on old fuzzy noise; 'կով' matched dialogue, not the English scene annotations. Now 'Celentano' and 'Lada' (45 sketches' visuals, no dialogue anywhere). The test now asserts each example matches for its advertised REASON, which is what would have caught both. Same fix applied to the zero-result tips.",
