notes = """
The user's remembered feedback was exactly right and the cause was worse than described:
not one description field but 48 of them on a single screen. Worth keeping the measurement
habit — every claim in this session came from a number taken in the browser at phone size,
including the before-state captured from live production so the improvement is provable.
Two dead ends recorded in LEARNINGS.md: capping by line count alone (a single unsplit line
still ran 2,500px) and moving SketchGrid behind "use client" for a load-more button (the RSC
payload then serialised all 532 sketches, so the page only fell 3.25MB -> 2.2MB).
"""
