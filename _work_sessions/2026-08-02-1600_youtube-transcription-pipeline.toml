THE IDEA AND WHY IT WORKED
- User's proposal: concatenate the audio of videos with no dialogue, upload to
  YouTube, harvest the auto-captions, split them back. Built it.
- The insight that made it work is not "YouTube transcribes well" -- it already
  had. It is that YouTube's language DETECTION fails on this audio: of 315
  existing caption files only 84 are Armenian, the rest being 92 Turkish, 49
  English, 24 Russian, 20 Romanian etc, which return `[Muzik]` markers or
  phonetic hallucination ("Chi Omega myrtana imports a culture jamming").
  Uploading ourselves means setting `defaultAudioLanguage` explicitly, which
  removes the guess. That single field is the whole mechanism.
- RESULT: 87 videos, 111,266 Armenian characters. 80 of 87 carry >500. Only 3
  weak, one of which is a 40-second clip. These were the emptiest rows in the
  archive -- no curated dialogue, no usable captions.

PIPELINE (three scripts, each doing one thing)
- build_transcription_batch.py  select candidates, probe REAL durations from the
  audio files, write the offset table
- render_transcription_batch.py normalise -> concat -> ID cards -> mux
- split_batch_transcript.py     map captions back per video by timestamp
- The offset table is the load-bearing part. The user's original plan had an
  on-screen ID identifying each clip; captions come from audio, so nothing on
  screen ever reaches the transcript. Splitting is arithmetic on start/end
  offsets instead, and the card is kept purely for human verification.
- Events are assigned by MIDPOINT, so a caption straddling a boundary lands with
  the clip holding most of it. Verified against synthetic captions before any
  real data existed: a deliberately straddling event landed correctly, and an
  event past the end was reported rather than absorbed into the last clip.

FOLDED INTO THE SITE
- 95 sketches that previously matched nothing but their own title now carry
  dialogue. Searchable at weight 2 (below curated text at 3, because a hit in
  machine output is weaker evidence), badged on cards, readable on the page.
- Kept under a separate `transcript` key, never merged into `text`. One is a
  person's transcription, the other a machine's.
- 10 new tests, 90 pass. Static build regenerates all 702 pages.

WHAT ELSE IS WORTH TRANSCRIBING -- measured, and the answer was surprising
- 538 videos still lack a transcript, but only ~60 are worth uploading.
- On the 46 videos holding BOTH curated text and a fetched transcript, curation
  runs 0.95 the length of ASR and is independently worded (median Jaccard 0.47 --
  same speech, different spelling, so genuine human work rather than pasted
  captions). Where dialogue is already curated, a transcript is a noisier
  duplicate. That killed ~15 planned uploads.
- batch05 built accordingly: the 60 videos with THIN curation (median 29 words),
  1.81 h. Rendered and verified; awaiting upload.

SONG SWEEP -- made it run without supervision
- The sweep only advanced when someone noticed it had stopped. One cooldown sat
  idle for 2.5 hours. sweep_songs.py now owns the whole cycle: work, detect the
  stop, wait out the cooldown, resume, repeat.
- Detects throttling by MEASURED PROGRESS, not exit code, counted from
  song_matches.csv -- the same file the resume logic reads, so supervisor and
  worker cannot disagree about what is done.
- Runs DETACHED (Start-Process, pid in logs/sweep_songs.pid). Four background
  tasks had been reaped by the harness mid-run; detaching is what finally let it
  run for hours.
- Progress this session: 2250 -> 3527 of 4171 clips, 348 -> 587 videos,
  430 -> 601 distinct tracks.
"""

