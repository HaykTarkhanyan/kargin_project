DECISIONS.md WAS CREATED THIS SESSION (it did not exist). Four entries, newest
first. #4 records building all four uploads before the pilot returned, which
reopened #3 -- and its outcome, since the risk did not materialise.

THREE MISTAKES WORTH NOT REPEATING
1. I told the user "killed with no errors -> relaunch immediately, no cooldown".
   WRONG, and disproved within minutes: the throttle budget is server-side and
   does not care that our process died. A run killed at 157 clips with zero
   errors was followed by a relaunch whose FIRST clip timed out. Always probe.
2. `--batches 1` writes `<out>/manifest.csv`, and I pointed --out at the top
   level, overwriting batch01's manifest. Recovered via git (it was committed),
   then re-verified batches 01-04 still partition the 87 exactly before moving
   on. Verify after a recovery, not just before.
3. I used PowerShell `Set-Content -Encoding utf8` to add an import to a UTF-8
   file. It mangled the Armenian regex [U+0530-U+058F] into mojibake AND
   prepended a BOM. Never edit non-ASCII files with PowerShell -- use the Edit
   tool or Python.

THE BUG THAT NEARLY SHIPPED, AND WHAT CAUGHT IT
ffmpeg's concat demuxer does not accumulate `duration` directives to their sum:
30 stills produced 6369 s of video against 6177.5 s of audio, so every ID card
drifted further behind the audio. Frame quantisation at 1 fps explains only
14.5 s of that 191.5 s gap. Caught ONLY by an explicit check comparing the muxed
output against the manifest total -- there was no visible symptom otherwise, and
it would have surfaced days later as cards not matching what you hear. Fixed by
gating each drawtext on absolute output time, so nothing accumulates.
Every batch since is verified by pulling a frame from its LAST clip, where drift
would be worst.

A FILTER THAT PAID FOR ITSELF
load_transcripts drops anything under 100 Armenian characters. 87 batch videos
went in, 84 came out -- the three excluded are exactly the failures (one had a
single Armenian character across three minutes of audio). No hand-listing of
video ids, and the payload never sees the junk.

BREAKER TUNING IS ABOUT FAILURE SPEED, NOT FAILURE COUNT
The 15-failure limit was chosen for a dropped wifi link, where each failure is an
instant DNS error and the streak costs nothing. Under a throttle each failure
burns the full 45 s timeout, so the same threshold measured ~15 min of dead
waiting per round. Dropping it to 4 cut that to ~3 min and is strictly gentler on
Shazam -- fewer requests while already blocked.
"""
