notes = """
THE licensed_content PRIOR WAS NARROWER THAN IT LOOKED — worth remembering.
All 17 YouTube music claims and all 35 region blocks land on
licensed_content=False, 52/52, never on True. That tempted me to skip the 442
True videos entirely. Running them anyway shows the prior is real but partial:
True videos have about half the clip hit rate (25% vs 46%), yet 60 of the first
88 scanned still contain identifiable music. `True` never meant "no music" — it
meant "no music anyone filed a claim on". Skipping them would have missed music
in roughly 250 sketches. A perfect correlation about rights claims is not a
correlation about audio content, and only running the excluded group tells you
which one you measured.

REVIEW-APP DEFECTS I FOUND BY READING, NOT BY IT FAILING
1. Lost update. Flask's dev server is threaded by default and every save is
   read-modify-write on one small file with no lock; two saves in flight could
   drop one. Added a lock and batched multi-field saves into one write.
2. Misleading exit code, caught by a test. apply_corrections returned 0 from its
   nothing-applicable branch, so an overlay where EVERY correction was refused
   as stale reported success. The guard worked and lied about it — worse than no
   guard, because you stop checking.
3. A correction naming a column the source lacks would have silently ADDED that
   column to kargin_eng.csv.
4. A top-level `function open()` shadowed window.open page-wide; a 404 from the
   video endpoint was consumed blindly and threw on d.fields.

BROWSER VERIFICATION CAUGHT WHAT 58 TESTS DID NOT. Variable dialogue length made
grid cards stretch to the tallest in the row, leaving up to 196px of dead space.
The fix needed three parts and the second only surfaced by measuring: flex
columns so the dialogue box absorbs slack, mt-auto on the footer (sketches with
NO dialogue have no flex child to absorb anything), and a line-clamp on the
catchphrase so one long quote cannot set the height of a whole row.
196px -> 12-52px, all cards uniform at 519px.
