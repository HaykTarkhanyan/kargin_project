SHAZAM THROTTLE — the important operational finding
- The script was async in shape but synchronous in fact (subprocess.run +
  time.sleep block the event loop), so concurrency would have bought nothing.
  Rewrote to create_subprocess_exec + asyncio.sleep with a semaphore.
- Then MEASURED that concurrency is a cliff, not a knob: an isolated burst of 5
  returns in 1.3s, but 5 sustained produced ZERO completions in two minutes, and
  3 served 28 clips then timed out on every request until the breaker fired.
- Root cause: shazamio sits on aiohttp_retry, which retries transparently with
  backoff. Shazam throttles by getting SLOWER, never by erroring — so the
  circuit breaker (which counts failures) had nothing to count and the run
  looked hung. Added a hard 45s timeout per recognition so a stall becomes a
  countable failure. That gap would have hung any earlier run too.
- The experiment cost a temporary block: afterwards even sequential requests
  timed out for ~20 minutes. Settled on concurrency 1 + sleep 0.15, which is
  still ~3x the old sleep 0.7 (5-7s/clip -> ~1.8s).

LOCAL CURATION UI (scripts/review_ui.py)
- Flask page listing all 702 videos; embedded player plus every curated field,
  `text` in a large box. Ctrl+S saves, unsaved-changes guard on navigate/close.
- Safety is the bulk of the work. The UI READS kargin_eng.csv and never writes
  it. Edits go to data/corrections.csv as an overlay, one row per changed field:
  video_id, field, old_value, new_value, edited_at.
- old_value is what the source held when the field was FIRST edited and is never
  rewritten by later edits, so it acts as a guard: apply refuses any correction
  whose old_value no longer matches the source (STALE) instead of discarding
  whatever changed it. Optimistic concurrency, not just "we kept a backup".
- Only 10 curated fields editable; video_id/links/id/duplicate_of rejected 400.
- Atomic writes, timestamped backup before every write, never pruned.
- scripts/apply_corrections.py is dry-run by default and the ONLY writer of
  kargin_eng.csv; backs it up before writing.
- Reviewed the app afterwards and fixed four real defects (see notes).

