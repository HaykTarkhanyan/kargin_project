notes = """
The PC ran out of memory mid-session (0.3 GB free, mostly the user's own
VS Code / Chrome / bun). Two symptoms looked like test failures and were not:
vitest 'Timeout waiting for worker to respond' on 6 files, and test:rules
reporting '19 skipped' with exit 1 (the emulator connection failed in
beforeAll). After a restart the same code passed both.

DECISIONS.md has mixed line endings (the HEAD blob has CRLF on 274 lines) and
carries other sessions' uncommitted entries. To commit one entry alone: build
the blob as HEAD's first 8 lines + the new entry's exact bytes from the working
tree + the rest of HEAD, then git hash-object -w --stdin and git update-index
--cacheinfo. Check with git diff --cached (only the new entry) and git diff
(none of its lines).

Deploy mechanics: a push to main runs firebase deploy --only firestore,hosting
in one CI step, then GitHub Pages in a later job. A new event type must reach
firestore.rules no later than the site that emits it, because log.ts commits a
batch atomically. The workflow has cancel-in-progress: true, so a second push
during a deploy cancels it; docs-only commits can use [skip ci].
"""
