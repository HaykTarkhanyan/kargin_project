notes = """
Method worth repeating: every claim here came from a measurement, and three of the
session's turns overturned a plausible-sounding design. Requiring "most words" gave
538 junk results; a word-boundary index looked cleaner and quietly broke Armenian
suffix matching; tuning thresholds as absolute numbers disabled the whole pass on
small test datasets because information scales with corpus size. The usage log's
search-then-open pairs turned out to be the only honest way to score a ranking
change — worth remembering now that the events collection has real traffic in it.
"""
