notes = """
Playwright MCP: browser_run_code_unsafe has no fs and no persistent globalThis
between calls, and only reads code files under the project or .playwright-mcp/.
What survives between calls is the page's own localStorage on youtube.com, so the
search scrape merges into that and browser_evaluate(filename=...) writes it out.
A run_code that passes 120 s moves to the background and notifies on completion.

The Logging API returns nothing without an explicit timestamp bound in the filter.
Cloud Monitoring daily buckets end at the query's end time-of-day, so their date
labels sit about a day off the event dates.

My first runtime estimate for the scout (2-8 min) was wrong by 3x: 285 channels,
two of them capped at 3,000 uploads, took 22-25 min sequentially.
"""
