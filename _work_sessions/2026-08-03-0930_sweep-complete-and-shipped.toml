notes = """
THE BIGGEST MISS: CI HAD BEEN FAILING FOR TWO DAYS AND I NEVER LOOKED.
Every Pages deploy since the review UI landed (2026-08-02) failed in ~16s, so
the live site was stale from 2026-08-01 despite several pushes. I told the user
more than once that a push "will deploy" without ever checking a run. The user
spotted it from a GitHub failure email, not me.

Cause: the workflow runs `uv sync`, which installs the default group only. flask
lives in the `review` group, so tests/review/* raised ModuleNotFoundError during
collection and pytest exited 2 before anything built.

Why it was invisible locally: I ran `uv run --group dev pytest`, resolving
against a venv that already had flask. The suite passed on my machine and COULD
NOT have passed in CI -- the two commands were never testing the same
environment. "92 tests pass" was true and worthless as a deploy predictor.
Rule going forward: after any push that matters, check the run. Green locally
says nothing about green in CI when the dependency sets differ.

COMPARING THE WRONG QUANTITY, TWICE
I concluded twice that the well-curated videos were not worth transcribing,
because curation and ASR had a median LENGTH ratio of 0.95. Both texts being the
same size says nothing about whether they contain the same material. The
sentence-level measure found a median 27% of ASR content missing from curation,
and one sketch at 92%. When a metric is cheap and the conclusion is "do nothing",
that is exactly when to check the metric actually measures the thing.

A RULE CAN BE RIGHT FOR EVERY CASE YOU HAVE SEEN AND STILL BE WRONG
Two defects this session shared a shape: a change altered WHICH data exists, and
code elsewhere had quietly assumed the old distribution.
  - the length-based shipping rule agreed with novelty for all 87 videos that had
    little or no curation, and only broke on the first batch where curation was
    substantial;
  - the card's `s.text || transcript` fallback was correct while transcripts only
    shipped for sketches with no text, and broke the moment 68 sketches had both.
Neither failed loudly, because both branches produce valid-looking output.

MEASURED THIS SESSION, WORTH KEEPING
- ASR/curation length ratio by curated-word band: 1-24 words -> 11.6x (the real
  prize, captured in batch05); 25-49 -> 0.98; 50+ -> ~1.05.
- Curation density (words per minute of runtime) predicts what ASR adds, but only
  weakly: r = -0.14, though the low-density half showed 24% uncovered against 11%
  for the high-density half.
- PowerShell's ConvertFrom-Json on a 2.3 MB nested payload is so slow it looks
  like a network timeout. Download to disk and parse with Python instead.
- PowerShell Set-Content mangles non-ASCII: it turned an Armenian regex into
  mojibake AND prepended a BOM to a .py file. Never edit non-ASCII files with
  PowerShell -- use the Edit tool or Python.
- Bash heredocs break on apostrophes in prose ("Petrov's"), even quoted. For
  long text files with natural language, use the Write/Edit tools.
"""
